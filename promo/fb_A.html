<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-tc/500.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-tc/700.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-tc/900.css">
<style>
*{box-sizing:border-box}
body{margin:0;width:1080px;height:1080px;overflow:hidden;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#fff;
background:linear-gradient(180deg,#12343B 0%,#0B4F57 55%,#028090 100%)}
.wrap{position:relative;width:1080px;height:1080px;padding:56px 64px 44px;display:flex;flex-direction:column;gap:26px}
.tag{align-self:flex-start;padding:10px 24px;border-radius:999px;background:rgba(244,169,60,.16);border:2px solid #F4A93C;color:#F4A93C;font-weight:700;font-size:26px;letter-spacing:.06em}
h1{margin:0;font-weight:900;font-size:76px;line-height:1.18;letter-spacing:.01em}
h1 em{font-style:normal;color:#F4A93C}
.sub{margin:0;font-size:30px;line-height:1.5;color:#D6ECEE;font-weight:500}
.pic{flex:1;min-height:0;border-radius:28px;overflow:hidden;border:6px solid rgba(255,255,255,.9);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.pic img{width:100%;height:100%;object-fit:cover;object-position:center 40%;display:block}
.cta{display:flex;align-items:center;justify-content:center;gap:14px;padding:22px 30px;border-radius:999px;background:#E8552D;font-size:36px;font-weight:900;box-shadow:0 10px 0 #A93A1C}
.cta .kw{background:#fff;color:#E8552D;padding:2px 18px;border-radius:12px}
.sign{text-align:center;font-size:24px;color:#BFE3E6;font-weight:500;letter-spacing:.04em}
</style></head><body><div class="wrap">
<div class="tag">幼兒園教保員必備・2–6 歲適用</div>
<h1>孩子想拿剪刀？<br>別急著收，<em>陪他安全學會</em></h1>
<p class="sub">安全約定＋五步引導＋五級練習單＋教案，一次給你</p>
<div class="pic"><img src="classroom.jpg"></div>
<div class="cta">留言<span class="kw">剪刀</span>索取練習單生成器</div>
<div class="sign">設計者｜愛迪樂　鍾孟修 職能治療師</div>
</div></body></html>
