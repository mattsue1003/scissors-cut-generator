<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-tc/500.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-tc/700.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-tc/900.css">
<style>
*{box-sizing:border-box}
body{margin:0;width:1080px;height:1080px;overflow:hidden;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#12343B;
background:linear-gradient(180deg,#12343B 0 330px,#F3F8F8 330px 100%)}
.wrap{position:relative;width:1080px;height:1080px;padding:52px 60px 40px;display:flex;flex-direction:column;gap:22px}
.mark{position:absolute;right:40px;top:-40px;font-size:400px;font-weight:900;color:rgba(255,255,255,.06);line-height:1}
.head{display:flex;gap:28px;align-items:center;color:#fff}
.head .t{flex:1}
h1{margin:0;font-weight:900;font-size:64px;line-height:1.2}
h1 em{font-style:normal;color:#F4A93C}
.sub{margin:10px 0 0;font-size:27px;line-height:1.5;color:#D6ECEE;font-weight:500}
.thumb{flex:0 0 330px;height:186px;border-radius:22px;overflow:hidden;border:5px solid #fff}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:#fff;border-radius:24px;padding:26px 30px;display:flex;flex-direction:column;justify-content:center;gap:14px;border-top:10px solid var(--c);box-shadow:0 8px 24px rgba(18,52,59,.08)}
.card .n{font-size:22px;font-weight:900;color:var(--c);letter-spacing:.1em}
.card h2{margin:0;font-size:44px;font-weight:900}
.card p{margin:0;font-size:28px;line-height:1.5;color:#3A5A60;font-weight:500}
.cta{display:flex;align-items:center;justify-content:center;gap:14px;padding:20px 30px;border-radius:999px;background:#E8552D;color:#fff;font-size:34px;font-weight:900;box-shadow:0 10px 0 #A93A1C}
.cta .kw{background:#fff;color:#E8552D;padding:2px 18px;border-radius:12px}
.sign{text-align:center;font-size:23px;color:#3A5A60;font-weight:500;letter-spacing:.04em}
</style></head><body><div class="wrap">
<div class="mark">5</div>
<div class="head"><div class="t"><h1>剪刀練習<br><em>分五級</em>，一鍵生成</h1><p class="sub">給教保員的剪刀引導工具包</p></div><div class="thumb"><img src="classroom.jpg"></div></div>
<div class="grid">
<div class="card" style="--c:#E8552D"><span class="n">01 安全</span><h2>剪刀六大約定</h2><p>坐好才剪、刀尖朝下、<br>握柄給別人，附 A4 海報</p></div>
<div class="card" style="--c:#F4A93C"><span class="n">02 分級</span><h2>五級練習單</h2><p>剪一刀→直線→轉彎→<br>曲線→形狀，附引導線</p></div>
<div class="card" style="--c:#028090"><span class="n">03 教案</span><h2>30 分鐘教案</h2><p>目標、流程、引導語、<br>觀察評量，照著帶就能上</p></div>
<div class="card" style="--c:#12343B"><span class="n">04 下載</span><h2>PDF・PPT</h2><p>直接列印，或下載 PPT<br>自己改字、搬圖</p></div>
</div>
<div class="cta">留言<span class="kw">剪刀</span>索取練習單生成器</div>
<div class="sign">設計者｜愛迪樂　鍾孟修 職能治療師</div>
</div></body></html>
