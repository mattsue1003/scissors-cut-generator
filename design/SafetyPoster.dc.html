<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>剪刀安全約定海報</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#B83A24}a:hover{color:#8F2A18}
</style>
</helmet>
<div style="width: 794px; height: 1123px; box-sizing: border-box; padding: 48px 52px; background: #FFFFFF; color: #1F2A44; font-family: 'Noto Sans TC', sans-serif; display: flex; flex-direction: column; gap: 22px">
  <div style="display: flex; align-items: center; gap: 24px">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
      <span style="align-self: flex-start; padding: 4px 14px; border-radius: 999px; background: {{accent}}; font-size: 15px; font-weight: 700">美勞角請張貼</span>
      <h1 style="margin: 0; font-family: 'LXGW WenKai TC', serif; font-size: 64px; line-height: 1.1; font-weight: 700">我們的<br>剪刀約定</h1>
    </div>
    <img src="/_blob/b81c5ad41c5b3691b830031d44b94cc4" alt="教保員陪幼兒用兒童剪刀剪紙的水彩插畫" style="width: 340px; height: 191px; object-fit: cover; display: block; border-radius: 18px">
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; flex: 1">
    <div style="border: 3px solid #1F2A44; border-radius: 22px; padding: 18px 20px; display: flex; gap: 16px; align-items: center">
      <span style="flex: 0 0 64px; height: 64px; border-radius: 50%; background: #FCE7B8; display: flex; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 32 32" fill="none" stroke="#1F2A44" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="23" r="4.5"></circle><circle cx="8" cy="9" r="4.5"></circle><path d="M12 11 L27 22 Q 29 24 26 24"></path><path d="M12 21 L27 10 Q 29 8 26 8"></path></svg></span>
      <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'LXGW WenKai TC', serif; font-size: 28px; font-weight: 700">用圓頭剪刀</span><span style="font-size: 16px; line-height: 1.5; color: #3C4760">老師給的安全剪刀</span></div>
    </div>
    <div style="border: 3px solid #1F2A44; border-radius: 22px; padding: 18px 20px; display: flex; gap: 16px; align-items: center">
      <span style="flex: 0 0 64px; height: 64px; border-radius: 50%; background: #D6E7F5; display: flex; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 32 32" fill="none" stroke="#1F2A44" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4 V18 H24"></path><path d="M8 18 V28"></path><path d="M24 18 V28"></path><path d="M8 13 H22"></path></svg></span>
      <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'LXGW WenKai TC', serif; font-size: 28px; font-weight: 700">坐好才剪</span><span style="font-size: 16px; line-height: 1.5; color: #3C4760">拿剪刀不走路、不跑跳</span></div>
    </div>
    <div style="border: 3px solid #1F2A44; border-radius: 22px; padding: 18px 20px; display: flex; gap: 16px; align-items: center">
      <span style="flex: 0 0 64px; height: 64px; border-radius: 50%; background: #CFE6D3; display: flex; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 32 32" fill="none" stroke="#1F2A44" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4 V26"></path><path d="M9 19 L16 26 L23 19"></path></svg></span>
      <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'LXGW WenKai TC', serif; font-size: 28px; font-weight: 700">刀尖朝下</span><span style="font-size: 16px; line-height: 1.5; color: #3C4760">要移動時合起來、握住刀刃</span></div>
    </div>
    <div style="border: 3px solid #1F2A44; border-radius: 22px; padding: 18px 20px; display: flex; gap: 16px; align-items: center">
      <span style="flex: 0 0 64px; height: 64px; border-radius: 50%; background: #FBE3DD; display: flex; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 32 32" fill="none" stroke="#1F2A44" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 H24"></path><path d="M19 7 L24 12 L19 17"></path><path d="M28 22 H8"></path><path d="M13 17 L8 22 L13 27"></path></svg></span>
      <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'LXGW WenKai TC', serif; font-size: 28px; font-weight: 700">握柄給別人</span><span style="font-size: 16px; line-height: 1.5; color: #3C4760">遞剪刀時，自己握刀刃</span></div>
    </div>
    <div style="border: 3px solid #1F2A44; border-radius: 22px; padding: 18px 20px; display: flex; gap: 16px; align-items: center">
      <span style="flex: 0 0 64px; height: 64px; border-radius: 50%; background: #FCE7B8; display: flex; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 32 32" fill="none" stroke="#1F2A44" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4 H20 L26 10 V28 H8 Z"></path><path d="M20 4 V10 H26"></path><path d="M12 17 H22" stroke-dasharray="3 3"></path></svg></span>
      <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'LXGW WenKai TC', serif; font-size: 28px; font-weight: 700">嘴巴只吃紙</span><span style="font-size: 16px; line-height: 1.5; color: #3C4760">不剪頭髮、衣服和身體</span></div>
    </div>
    <div style="border: 3px solid #1F2A44; border-radius: 22px; padding: 18px 20px; display: flex; gap: 16px; align-items: center">
      <span style="flex: 0 0 64px; height: 64px; border-radius: 50%; background: #D6E7F5; display: flex; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 32 32" fill="none" stroke="#1F2A44" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12 H25 L23 28 H9 Z"></path><path d="M13 12 V5"></path><path d="M19 12 V5"></path></svg></span>
      <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'LXGW WenKai TC', serif; font-size: 28px; font-weight: 700">用完送回家</span><span style="font-size: 16px; line-height: 1.5; color: #3C4760">放回剪刀筒、紙屑進盒子</span></div>
    </div>
  </div>

  <div style="border-radius: 22px; background: #1F2A44; color: #FFFFFF; padding: 20px 26px; display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 15px; font-weight: 700; color: {{accent}}; letter-spacing: 0.1em">一起念口訣</span>
    <span style="font-family: 'LXGW WenKai TC', serif; font-size: 30px; line-height: 1.4">大拇指朝天空，嘴巴張開、閉起來，一口一口往前走！</span>
  </div>

  <div style="display: flex; align-items: flex-end; gap: 16px; font-size: 20px; font-weight: 700">
    <span>我會遵守約定，簽名：</span>
    <span style="flex: 1; border-bottom: 2.5px solid #1F2A44; height: 30px"></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F6B93B","options":["#F6B93B","#7CC08A","#7FB3DE","#F28B76"]},"$preview":{"width":794,"height":1123}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F6B93B' };
  }
}
</script>
</body>
</html>
